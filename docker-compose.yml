services:
  pose-eval:
    build: .
    image: pose-eval-gpu
    # Requires Docker Desktop with WSL2 backend + NVIDIA Container Toolkit
    # (you already confirmed this works via `docker run --gpus all ...`)
    gpus: all
    volumes:
      # Left side = path on your Windows machine, right side = path inside the container.
      # Adjust the left-hand paths to match where things actually live on your PC.
      - ./clips_mp4:/workspace/clips_mp4
      - ./output_comparison_results:/workspace/output_comparison_results
      - ./models:/workspace/models
      # Caches the MoveNet download from TF Hub so it doesn't re-download every run.
      - ./tfhub_cache:/root/.cache/tfhub_modules
    environment:
      - TFHUB_CACHE_DIR=/root/.cache/tfhub_modules
    # Override the script's Windows-style default paths with container paths.
    # Edit --yolo-model / --mediapipe-model to match whatever you put under ./models
    command: >
      --dir clips_mp4/0
      --yolo-model models/yolov8n-pose.pt
      --mediapipe-model models/pose_landmarker_heavy.task
      --output-dir output_comparison_results
      --device gpu
